<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Sunum Altlığı</title>

<style>
/* Portfolyo ile aynı dil: kâğıt zemin, mürekkep, bordo vurgu, Inter Tight, ince çizgiler. Tek (açık) görünüm. */
:root {
  --paper: #f4f2ee; --ink: #1d1c1a; --red: #a3201b;
  --muted: #84837f; --line: #d2d0cc; --soft: #ebe8e3;
  --font: "Inter Tight", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --display: "Cormorant Garamond", "Cormorant", Garamond, "Times New Roman", serif;
  --gx: clamp(16px, 2.4vw, 32px);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 13.5px/1.5 var(--font); letter-spacing: -0.003em; -webkit-font-smoothing: antialiased; }
::selection { background: var(--red); color: var(--paper); }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 1.5px solid var(--red); outline-offset: 2px; }
#app { height: 100%; display: flex; flex-direction: column; }
.gut { padding-left: max(var(--gx), env(safe-area-inset-left, 0px)); padding-right: max(var(--gx), env(safe-area-inset-right, 0px)); }

/* Üst çubuk */
.bar { flex: none; height: 48px; display: flex; align-items: center; gap: 20px; border-bottom: 1px solid var(--line); font-size: 12.5px; background: var(--paper); position: relative; z-index: 5; }
.bar .who { font-weight: 500; white-space: nowrap; }
.bar .mid { flex: 1; min-width: 0; display: flex; gap: 14px; align-items: baseline; overflow: hidden; }
.bar .mid .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar .st { color: var(--muted); white-space: nowrap; }
.bar .st.err { color: var(--red); }
.bar .acts { display: flex; gap: 18px; align-items: center; }
.btn { background: none; border: 0; padding: 6px 0; cursor: pointer; color: var(--ink); white-space: nowrap; transition: color .2s; }
.btn:hover { color: var(--red); }
.btn:disabled { color: var(--line); cursor: default; }
.btn.m { color: var(--muted); }
.btn.m:hover { color: var(--red); }
.btn.u { text-decoration: underline; text-decoration-color: var(--red); text-underline-offset: 4px; text-decoration-thickness: 1.5px; }
.btn .r { color: var(--red); margin-right: 6px; }
.menu-w { position: relative; }
.menu { position: absolute; right: 0; top: 36px; background: var(--paper); border: 1px solid var(--ink); z-index: 20; display: grid; grid-template-columns: 1fr 1fr; min-width: 340px; }
.menu[hidden] { display: none; }
.mcol { padding: 10px 0 8px; display: grid; align-content: start; }
.mcol + .mcol { border-left: 1px solid var(--line); }
.mh { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding: 0 14px 6px; }
.menu button { display: flex; justify-content: space-between; gap: 16px; width: 100%; text-align: left; background: none; border: 0; padding: 9px 14px; cursor: pointer; }
.menu button:hover { color: var(--red); }
.menu small { color: var(--muted); }

/* Ana sayfa */
.home { flex: 1; overflow: auto; }
.home-in { padding-block: clamp(28px, 5vw, 64px) 96px; }
.hero { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: clamp(12px, 2vw, 24px); align-items: end; row-gap: 24px; margin-bottom: clamp(40px, 6vw, 80px); }
.hero h1 { grid-column: 1 / 9; margin: 0; font-family: var(--display); font-weight: 300; font-size: clamp(3rem, 9vw, 8.5rem); line-height: .88; letter-spacing: .02em; text-transform: uppercase; }
.hero h1 i { font-style: normal; color: var(--red); }
.hero p { grid-column: 9 / 13; margin: 0; color: var(--muted); max-width: 38ch; font-size: 14px; }
.sec { border-top: 1px solid var(--ink); padding-top: 14px; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: clamp(12px, 2vw, 24px); }
.sec-head { grid-column: 1 / 4; font-size: 12.5px; display: flex; gap: 10px; }
.sec-head span { color: var(--red); }
.sec-body { grid-column: 4 / 13; min-width: 0; position: relative; }
.sec-body::before { content: ""; position: absolute; left: 0; top: -15px; width: 56px; height: 3px; background: var(--red); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 44px 24px; padding-top: 28px; }
.card .thumb { display: block; width: 100%; padding: 0; background: none; cursor: pointer; border: 1px solid var(--line); transition: border-color .2s; }
.card .thumb:hover { border-color: var(--ink); }
.cap { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; padding-top: 12px; align-items: baseline; }
.cap .no { color: var(--red); font-size: 12.5px; }
.cap h3 { margin: 0; font-weight: 500; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cap .y { color: var(--muted); font-size: 12.5px; }
.card .meta { color: var(--muted); font-size: 12.5px; padding-left: calc(2ch + 10px); }
.card .cact { display: flex; gap: 18px; padding-left: calc(2ch + 10px); font-size: 12.5px; }
.newcard { display: grid; place-items: center; aspect-ratio: 16 / 9; border: 1px dashed var(--muted); background: none; cursor: pointer; width: 100%; font-family: var(--display); font-weight: 400; font-size: 24px; letter-spacing: .14em; text-transform: uppercase; transition: color .2s, border-color .2s; }
.newcard:hover { color: var(--red); border-color: var(--red); }
.newform { grid-column: 4 / 13; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 24px; padding: 28px 0 8px; }
.newform .full { grid-column: 1 / -1; }
.f label, .lbl { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.f input, .f textarea, .f select { width: 100%; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 7px 0; font-size: 14px; border-radius: 0; }
.f textarea { resize: vertical; min-height: 92px; line-height: 1.55; border: 1px solid var(--line); padding: 8px 10px; }
.f input:focus, .f textarea:focus, .f select:focus { outline: none; border-color: var(--red); }
.radios { display: flex; flex-wrap: wrap; gap: 8px 22px; }
.radios label { display: flex; gap: 8px; align-items: center; color: var(--ink); font-size: 13.5px; cursor: pointer; }
.radios input { accent-color: var(--red); width: auto; }
.empty-note { color: var(--muted); padding-top: 28px; max-width: 52ch; }

/* Düzenleyici */
.ed { flex: 1; min-height: 0; display: grid; grid-template-columns: 210px minmax(0, 1fr) 330px; }
.ed-list { border-right: 1px solid var(--line); overflow: auto; padding: 16px 16px 40px; }
.ed-list .lh { display: flex; justify-content: space-between; font-size: 12.5px; margin-bottom: 14px; }
.ed-list .lh span { color: var(--red); }
.li { display: block; width: 100%; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; margin-bottom: 16px; }
.li .mini { border: 1px solid var(--line); }
.li.on .mini { border-color: var(--ink); outline: 1px solid var(--ink); }
.li .lc { display: flex; gap: 8px; font-size: 12px; padding-top: 6px; }
.li .lc b { font-weight: 400; color: var(--red); }
.li .lc span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li-ops { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; margin: -8px 0 18px; }
.addlist { display: grid; gap: 2px; font-size: 12.5px; margin-top: 6px; }
.addlist button { text-align: left; background: none; border: 0; padding: 5px 0; cursor: pointer; border-top: 1px solid var(--line); }
.addlist button:hover { color: var(--red); }
.stage { overflow: auto; display: grid; place-items: center; padding: 28px; container-type: size; }
.stage-in { width: min(100cqw - 56px, (100cqh - 76px) * var(--r)); }
.hint { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 12px; padding-top: 10px; }
.hint b { font-weight: 400; color: var(--ink); }
.ed-panel { border-left: 1px solid var(--line); overflow: auto; padding: 0 20px 60px; }
.tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--paper); z-index: 2; height: 44px; align-items: center; font-size: 12.5px; }
.tabs button { background: none; border: 0; padding: 0; cursor: pointer; color: var(--muted); }
.tabs button.on { color: var(--ink); text-decoration: underline; text-decoration-color: var(--red); text-underline-offset: 6px; text-decoration-thickness: 1.5px; }
.grp { padding-top: 22px; display: grid; gap: 16px; }
.grp > h4 { margin: 0; font-weight: 400; font-size: 12px; color: var(--muted); border-top: 1px solid var(--ink); padding-top: 10px; display: flex; justify-content: space-between; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.tpls { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 8px; }
.tpl { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; font-size: 11px; color: var(--muted); }
.tpl .tm { border: 1px solid var(--line); display: block; }
.tpl:hover { color: var(--ink); }
.tpl.on { color: var(--ink); }
.tpl.on .tm { border-color: var(--red); outline: 1px solid var(--red); }
.slotrow { display: grid; grid-template-columns: 14px 64px minmax(0, 1fr); gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); align-items: start; }
.slotrow.sel { background: linear-gradient(90deg, rgba(163,32,27,.06), transparent); }
.slotrow .sl { color: var(--red); font-size: 12px; padding-top: 2px; }
.slotrow .sth { aspect-ratio: 4 / 3; background: var(--soft); overflow: hidden; display: grid; place-items: center; color: var(--muted); font-size: 18px; font-weight: 300; cursor: pointer; border: 0; padding: 0; }
.slotrow .sth img { width: 100%; height: 100%; object-fit: cover; display: block; }
.slotrow input, .slotrow textarea { width: 100%; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 4px 0; font-size: 13px; border-radius: 0; }
.slotrow textarea { resize: vertical; min-height: 48px; font-size: 12.5px; }
.slotrow input:focus, .slotrow textarea:focus { outline: none; border-color: var(--red); }
.sbtns { display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 12px; margin-top: 4px; }
.steprow { display: grid; gap: 6px; padding: 10px 0; border-top: 1px solid var(--line); }
.steprow .row2 input { width: 100%; }
.sw { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.sw label { display: grid; gap: 2px; justify-items: center; font-size: 10.5px; color: var(--muted); }
.sw input[type=color] { width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 50%; padding: 0; background: none; cursor: pointer; }
.sw input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
.sw input[type=color]::-webkit-color-swatch { border: 0; border-radius: 50%; }
.themes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.theme { background: none; border: 1px solid var(--line); padding: 6px; cursor: pointer; font-size: 11.5px; text-align: left; display: grid; gap: 6px; }
.theme i { display: flex; height: 22px; }
.theme i b { flex: 1; }
.theme.on { border-color: var(--red); outline: 1px solid var(--red); }
.chk { display: flex; gap: 8px; align-items: center; cursor: pointer; font-size: 13px; }
.chk input { accent-color: var(--red); }
.note { font-size: 12px; color: var(--muted); margin: 0; }

/* Pafta görünümü (SVG + etkileşim katmanı) */
.sh { position: relative; container-type: inline-size; line-height: 0; }
.sh svg { display: block; width: 100%; height: auto; }
.hit { position: absolute; line-height: 1.2; cursor: pointer; }
.hit.empty { border: 1px dashed rgba(29,28,26,.35); display: grid; place-items: center; text-align: center; color: rgba(29,28,26,.55); font-size: max(10px, 1.05cqw); }
.hit.empty.top { place-items: start; padding: 1.6cqw; text-align: left; }
.hit.empty.top > div { display: flex; gap: 8px; align-items: baseline; background: rgba(244,242,238,.85); padding: 6px 10px; }
.hit.empty span { display: block; font-size: max(16px, 2.6cqw); font-weight: 300; line-height: 1; }
.hit.empty:hover, .hit.drop { border: 1.5px dashed var(--red); color: var(--red); background: rgba(163,32,27,.05); }
.hit.full:hover { outline: 1px solid rgba(163,32,27,.6); }
.hit.sel { outline: 2px solid var(--red); }
.hit.pan { cursor: grab; }
.hit.pan:active { cursor: grabbing; }
.hit.busy { background: rgba(244,242,238,.75); display: grid; place-items: center; font-size: 12px; color: var(--ink); border: 0; }
.tools { position: absolute; right: 6px; top: 6px; display: none; gap: 1px; line-height: 1; }
.hit.full:hover .tools, .hit.sel .tools { display: flex; }
.tools button { background: var(--paper); border: 0; padding: 6px 9px; font-size: 11.5px; cursor: pointer; }
.tools button:hover { color: var(--red); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper); padding: 10px 16px; font-size: 13px; z-index: 50; max-width: calc(100% - 32px); }
.loading { flex: 1; display: grid; place-items: center; color: var(--muted); }

@media (max-width: 1000px) {
  .ed { display: block; overflow: auto; }
  .ed-list { border-right: 0; border-bottom: 1px solid var(--line); display: flex; gap: 12px; overflow-x: auto; padding-bottom: 12px; }
  .ed-list .lh, .li-ops, .addw { flex: none; }
  .li { flex: none; width: 140px; margin: 0; }
  .ed-list .side { flex: none; width: 150px; }
  .stage { container-type: normal; padding: 16px; display: block; }
  .stage-in { width: 100%; }
  .ed-panel { border-left: 0; border-top: 1px solid var(--line); }
  .hero h1, .hero p, .sec-head, .sec-body, .newform { grid-column: 1 / 13; }
  .sec-head { margin-bottom: 8px; }
  .bar .hide-s { display: none; }
}
@media (max-width: 560px) { .newform { grid-template-columns: 1fr; } .bar { gap: 12px; } .bar .acts { gap: 12px; } }
/* Plan boya */
#pp[hidden] { display: none; }
#pp { position: fixed; inset: 0; z-index: 40; background: var(--paper); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.pp-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 230px minmax(0, 1fr) 320px; }
.pp-tools, .pp-leg { overflow: auto; padding: 0 18px 40px; }
.pp-tools { border-right: 1px solid var(--line); }
.pp-leg { border-left: 1px solid var(--line); }
.pp-view { position: relative; overflow: hidden; background: var(--soft); touch-action: none; cursor: crosshair; }
.pp-view[data-tool="pan"] { cursor: grab; }
.pp-view[data-tool="fill"] { cursor: cell; }
.pp-cv { position: absolute; left: 0; top: 0; transform-origin: 0 0; box-shadow: 0 0 0 1px var(--line); }
.pp-cv canvas { display: block; }
.pp-cv #ppov { position: absolute; inset: 0; pointer-events: none; }
.pp-tools input[type=range] { width: 100%; accent-color: var(--red); }
.pp-tools .f label b { font-weight: 500; color: var(--ink); }
.ptools { display: grid; gap: 2px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--ink); }
.seg button { background: none; border: 0; padding: 8px 4px; cursor: pointer; font-size: 12.5px; }
.seg button + button { border-left: 1px solid var(--ink); }
.seg button.on { background: var(--ink); color: var(--paper); }
.pt { display: flex; justify-content: space-between; background: none; border: 0; border-top: 1px solid var(--line); padding: 8px 0; cursor: pointer; text-align: left; }
.pt small { color: var(--muted); }
.pt:hover { color: var(--red); }
.pt.on { color: var(--red); font-weight: 500; }
.lgrow { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; padding: 9px 0 9px 6px; border-top: 1px solid var(--line); cursor: pointer; border-left: 2px solid transparent; }
.lgrow.on { border-left-color: var(--red); background: rgba(163,32,27,.05); }
.lsw { width: 34px; height: 34px; border: 1px solid var(--line); background-size: cover; }
.lf input:not([type]), .lf input[id^="lg-n"] { width: 100%; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 3px 0; font-size: 13px; }
.lf input:focus { outline: none; border-color: var(--red); }
.lctl { display: flex; gap: 8px; align-items: center; margin-top: 5px; font-size: 12px; flex-wrap: wrap; }
.lctl input[type=color] { width: 26px; height: 22px; border: 1px solid var(--line); padding: 0; background: none; cursor: pointer; }
.lctl select { border: 0; border-bottom: 1px solid var(--line); background: none; font-size: 12px; padding: 2px 0; }
.lctl .used { color: var(--red); font-size: 11px; }
@media (max-width: 1000px) {
  .pp-body { display: flex; flex-direction: column; overflow: auto; }
  .pp-view { flex: none; height: 62vh; order: -1; }
  .pp-tools, .pp-leg { border: 0; border-top: 1px solid var(--line); overflow: visible; }
}
.demo-hint { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 11px 18px; font-size: 13px; z-index: 60; white-space: nowrap; transition: opacity .6s, transform .6s; pointer-events: none; }
.demo-hint b { font-weight: 500; color: #e7b3ae; }
.demo-hint.off { opacity: 0; transform: translate(-50%, 10px); transition-delay: 3s; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
(() => {
"use strict";
const PORTFOLIO = "../index.html#yapay-zeka";
const FONT = '"Inter Tight","Helvetica Neue",Helvetica,Arial,sans-serif';
const FONT_D = '"Cormorant Garamond",Cormorant,Garamond,"Times New Roman",serif';
const FMT = {
  W169: { name: "16:9 ekran", mm: [338.67, 190.5], px: 3840 },
  R43:  { name: "4:3 ekran",  mm: [297, 222.75], px: 3200 },
  A4L:  { name: "A4 yatay",   mm: [297, 210], px: 3508 },
  A3L:  { name: "A3 yatay",   mm: [420, 297], px: 4961 },
  A1L:  { name: "A1 yatay",   mm: [841, 594], px: 4967 },
};
const THEMES = {
  kagit:  { name: "Kâğıt",  bg: "#f4f2ee", ink: "#1d1c1a", block: "#a3201b", on: "#f4f2ee" },
  beyaz:  { name: "Beyaz",  bg: "#ffffff", ink: "#1d1c1a", block: "#1d1c1a", on: "#ffffff" },
  zeytin: { name: "Zeytin", bg: "#e7e3dc", ink: "#2b2a24", block: "#45442f", on: "#efebe4" },
  kahve:  { name: "Kahve",  bg: "#ebe6e0", ink: "#2a201b", block: "#4e2416", on: "#efe8e1" },
};
const AY = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const today = () => { const d = new Date(); return AY[d.getMonth()] + " " + d.getFullYear(); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const p2 = n => String(n).padStart(2, "0");
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clamp = (v, a = 0, b = 100) => Math.max(a, Math.min(b, v));
const up = s => String(s || "").toLocaleUpperCase("tr");
const LET = "ABCDEFGHIJKLMNOP";
function hexmix(a, b, t) {
  const pa = [1, 3, 5].map(i => parseInt(a.slice(i, i + 2), 16)), pb = [1, 3, 5].map(i => parseInt(b.slice(i, i + 2), 16));
  return "#" + pa.map((v, i) => Math.round(v * t + pb[i] * (1 - t)).toString(16).padStart(2, "0")).join("");
}
function pal(p) {
  const t = THEMES[p.theme] || THEMES.kagit;
  return { ...t, muted: hexmix(t.ink, t.bg, .55), faint: hexmix(t.ink, t.bg, .14), line: hexmix(t.ink, t.bg, .3), empty: hexmix(t.ink, t.bg, .07) };
}

/* ---------------- Ölçüm ve metin kırma ---------------- */
const mctx = document.createElement("canvas").getContext("2d");
function setF(ctx, size, weight, ls, scale, fam = FONT) {
  ctx.font = `${weight} ${size * scale}px ${fam}`;
  if ("letterSpacing" in ctx) ctx.letterSpacing = (ls * size * scale) + "px";
}
function measure(t, size, weight, ls, fam) { setF(mctx, size, weight, ls, 20, fam); return mctx.measureText(t).width / 20; }
function wrap(text, size, weight, ls, maxW, fam) {
  const out = [];
  for (const para of String(text || "").split("\n")) {

      x.textAlign = op.align === "right" ? "right" : op.align === "center" ? "center" : "left";
      op.lines.forEach((ln, k) => { if (ln) x.fillText(ln, op.x * u, (op.y + op.size * .78 + k * op.size * op.lh) * u); });
    } else if (op.k === "line") {

/* ---------------- Depolama: bulut (db + assets), yoksa bu tarayıcı ---------------- */
const Store = { mode: "local", db: null, assets: null, dl: null, projects: [], urls: new Map(), loading: new Map(), mem: new Map() };
let idb = null;
function idbOpen() {
  return new Promise(res => {
    try {
      const r = indexedDB.open("sunum-altligi", 1);
      r.onupgradeneeded = () => { r.result.createObjectStore("projects", { keyPath: "id" }); r.result.createObjectStore("images"); };
      r.onsuccess = () => { idb = r.result; res(); };
      r.onerror = () => res();
    } catch { res(); }
  });
}
function idbDo(store, mode, fn) {
  return new Promise((res, rej) => {
    if (!idb) return res(null);
    try { const t = idb.transaction(store, mode), q = fn(t.objectStore(store)); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); } catch (e) { rej(e); }
  });
}
async function initStore() {
  let db = null, assets = null, dl = null;
  try {
    if (window.claude && claude.use) [db, assets, dl] = await Promise.all([claude.use("db"), claude.use("assets"), claude.use("downloads")]);
  } catch {}
  Store.dl = dl;
  if (db) {
    Store.mode = "cloud"; Store.db = db; Store.assets = assets;
    await new Promise(res => {
      let done = false;
      const fin = () => { if (!done) { done = true; res(); } };
      const t = setTimeout(() => { toast("Kayıtlara ulaşılamadı. Bağlantını kontrol edip sayfayı yenile."); fin(); }, 10000);
      db.collection("projects").onSnapshot(snap => {
        clearTimeout(t);
        Store.projects = snap.docs.map(d => { try { const v = d.data(); return v ? clone(v) : null; } catch { return null; } }).filter(Boolean);
        fin(); if (S.view === "home" && S.started) safe(renderHome);
      }, err => { clearTimeout(t); toast("Kayıtlar yüklenemedi (" + err.code + ")."); fin(); });
    });
  } else {
    Store.mode = "local";
    await idbOpen();
    try { Store.projects = (await idbDo("projects", "readonly", s => s.getAll())) || []; } catch { Store.projects = []; }
  }
}
async function savePj(p) {
  const d = clone(p);
  if (Store.mode === "cloud") await Store.db.doc("projects/" + p.id).set(d);
  else {
    await idbDo("projects", "readwrite", s => s.put(d));
    const i = Store.projects.findIndex(x => x.id === d.id);
    if (i >= 0) Store.projects[i] = d; else Store.projects.push(d);

}
async function delPj(id) {
  if (Store.mode === "cloud") await Store.db.doc("projects/" + id).delete();

}
async function putImage(blob) {
  if (Store.mode === "cloud") {
    if (!Store.assets) throw new Error("Görsel yüklemek için bu sunuma düzenleme yetkin olmalı.");
    try { const r = await Store.assets.upload(blob, { type: blob.type }); return { a: r.id }; }
    catch (e) {
      const m = { too_large: "Görsel 20 MB sınırını aşıyor.", unsupported_type: "Bu dosya türü desteklenmiyor. PNG, JPG veya WEBP kullan.", quota_or_state: "Depolama alanı dolu.", rate_limited: "Çok hızlı yükleme yapıldı, biraz bekleyip tekrar dene." }[e.code];
      throw new Error(m || "Yükleme başarısız oldu, tekrar dene.");
    }

function srcOf(ref) {

}

async function prep(file) {
  let bmp;
  try { bmp = await createImageBitmap(file); } catch { throw new Error(`"${file.name}" okunamadı. PNG, JPG veya WEBP kullan (PDF ve HEIC desteklenmiyor).`); }
  const w = bmp.width, h = bmp.height;
  const ok = ["image/png", "image/jpeg", "image/webp", "image/gif"].includes(file.type);
  if (ok && file.size <= 19.5e6) { bmp.close && bmp.close(); return { blob: file, w, h }; }
  for (const max of [7000, 5000, 3500]) {
    const s = Math.min(1, max / Math.max(w, h)), cv = document.createElement("canvas");
    cv.width = Math.round(w * s); cv.height = Math.round(h * s);
    const x = cv.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, cv.width, cv.height); x.drawImage(bmp, 0, 0, cv.width, cv.height);
    const blob = await new Promise(r => cv.toBlob(r, "image/jpeg", .92));
    if (blob && blob.size <= 19.5e6) { bmp.close && bmp.close(); return { blob, w: cv.width, h: cv.height }; }
  }
  throw new Error("Görsel çok büyük, küçültüp tekrar dene.");
}

  const hit = e.target.closest && e.target.closest(".hit[data-slot]");
  const row = e.target.closest && e.target.closest(".slotrow");
  let i = hit ? +hit.dataset.slot : null;
  if (row) { const b = row.querySelector("[data-i]"); if (b) i = +b.dataset.i; }
  uploadInto(files, i);
});
document.addEventListener("paste", e => {
  if (S.view !== "editor" || PP.on) return;
  const files = [...(e.clipboardData?.files || [])].filter(isImg);
  if (!files.length) return;
  e.preventDefault(); uploadInto(files, S.sel);
});
document.addEventListener("keydown", e => {
  if (S.view !== "editor" || PP.on) return;
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName);
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === "s") { e.preventDefault(); flush(); return; }
  if (typing) return;
  if (mod && e.key.toLowerCase() === "z") { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if (mod && e.key.toLowerCase() === "y") { e.preventDefault(); redo(); }
  else if (e.key === "PageDown" || e.key === "ArrowDown" && e.altKey) { if (S.si < S.cur.sheets.length - 1) { S.si++; S.sel = null; refresh(["stage", "list", "panel"]); } }
  else if (e.key === "PageUp" || e.key === "ArrowUp" && e.altKey) { if (S.si > 0) { S.si--; S.sel = null; refresh(["stage", "list", "panel"]); } }
});
window.addEventListener("pagehide", () => { if (S.saveT) flush(); });

function nav(id) {
  try { history.replaceState(null, "", id ? "#p-" + id : location.pathname + location.search); } catch {}
  if (id) openProject(id); else { S.cur = null; renderHome(); }
}
function route() {
  const m = location.hash.match(/^#p-([a-z0-9]+)$/);
  if (m) openProject(m[1]);
  else { if (S.cur && S.saveT) flush(); S.cur = null; renderHome(); }
}
window.addEventListener("hashchange", () => safe(route));

function safe(fn) {
  try { fn(); } catch (e) {
    console.error(e);
    app.innerHTML = `<div class="loading" style="text-align:center;line-height:1.7">Sayfa açılırken bir hata oluştu.<br><span style="color:var(--ink)">${esc(e && e.message || e)}</span><br><button class="btn u" onclick="location.reload()">Yeniden dene</button></div>`;
  }
}
/* ---------------- Portfolyo örneği: hazır sunum + kendi kendine tur ---------------- */
const DEMO = "demoazurea";
async function seedDemo() {
  const I = (n, h = 1279) => ({ u: `../assets/proje9/${n}.jpg`, w: 2000, h });
  const put = (s, ...refs) => { refs.forEach((r, k) => { if (s.slots[k]) s.slots[k].img = r; }); return s; };
  const sheets = [
    put(mk("kapak", "Kapak"), I("03")),
    put(mk("icindekiler", "İçindekiler"), I("01"), I("05")),
    put(mk("metin", "Proje hakkında", { notes: "Eğimli arazide kademelenerek yükselen, akışkan beyaz saçaklarla tanımlanan teraslı bir konut yapısı.\n\nHer katta denize bakan geniş teraslar, havuz bahçesi ve yeşille iç içe bir zemin kat. Kütle, topografyayı izleyerek basamaklanıyor; saçaklar hem gölge hem de yatay bir ritim kuruyor." }), I("06")),
    put(mk("iki", "Kütle ve yerleşim", { caps: ["Kuşbakışı", "Havuz bahçesi"] }), I("01"), I("02")),
    put(mk("render3", "Renderlar", { caps: ["Ana cephe", "Teraslar", "Deniz manzarası"] }), I("04"), I("05"), I("06")),
    put(mk("malzeme", "Malzeme ve renk", { caps: ["Cephe", "Teras", "Peyzaj"], notes: "Beyaz akışkan saçaklar, ahşap teras döşemesi ve yerel bitki örtüsü; denize açılan sakin bir palet." }), I("05"), I("06"), I("02")),
    put(mk("rendertam", "Atmosfer", { caps: ["Kuşadası · Aydın"] }), I("03")),
    mk("zaman", "Proje takvimi"),
    put(mk("tesekkur", "Teşekkürler"), I("04")),
  ];
  sheets[5].colors = ["#f2efe9", "#d9cbb8", "#8a9a83", "#3f6f8c", "#1d1c1a"];
  const p = { id: DEMO, title: "Azurea", sub: "Teraslı konut · Kuşadası", author: "Esma Dado", date: today(), format: "W169", theme: "kagit", created: Date.now(), updated: Date.now(), sheets };
  try { await savePj(p); } catch { const i = Store.projects.findIndex(x => x.id === DEMO); if (i >= 0) Store.projects[i] = p; else Store.projects.push(p); }
}
function demoTour() {
  const hint = document.createElement("div");
  hint.className = "demo-hint";
  hint.innerHTML = `<b>Kendin dene</b> · Sayfalara tıkla, sağdan yerleşimi ya da temayı değiştir, bir görseli çerçeveye sürükle.`;
  document.body.appendChild(hint);
  const themes = Object.keys(THEMES); let tk = 0, stop = false;
  const end = () => { if (stop) return; stop = true; clearInterval(timer); hint.classList.add("off"); setTimeout(() => hint.remove(), 6000); };
  ["pointerdown", "keydown", "wheel", "dragenter"].forEach(ev => addEventListener(ev, end, { once: true, capture: true }));
  const timer = setInterval(() => {
    if (stop || S.view !== "editor" || !S.cur) return;
    const n = S.cur.sheets.length;
    S.si = (S.si + 1) % n; S.sel = null;
    if (S.si === 0) { tk = (tk + 1) % themes.length; S.cur.theme = themes[tk]; }
    refresh(["stage", "list", "panel"]);
    const on = document.querySelector(".li.on"); if (on) on.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }, 2600);
}
(async () => {
  try { await Promise.all([fontsReady(), initStore()]); } catch (e) { console.error(e); }
  try { await seedDemo(); } catch (e) { console.error(e); }
  S.started = true;
  if (!/^#p-/.test(location.hash)) { nav(DEMO); demoTour(); }
  else safe(route);
})();
})();
